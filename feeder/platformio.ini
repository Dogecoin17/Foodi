; ESP32-S3 (final product): auger DC motor + HX711 load cell, closed loop
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
    bogde/HX711

; ESP-WROOM-32 devkit (video prototype): 28BYJ-48 stepper via ULN2003, no load cell
; (the CCM reads the kitchen scale through the camera instead)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
build_flags =
    -D FEEDER_STEPPER
    -D FEEDER_NO_LOADCELL

; Arduino Nano (video prototype fallback): same protocol over USB serial,
; 28BYJ-48 stepper on D4-D7, no radio on the Nano (the laptop is the link)
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../nano/>

; old-bootloader Nano (pre-2018, 57600 baud upload): pio run -e nanoatmega328 -t upload
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../nano/>
