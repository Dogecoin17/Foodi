; ESP32-S3 + camera (final product): 28BYJ-48 stepper via ULN2003, volumetric
; dosing (no load cell - the CCM reads the kitchen scale through the camera),
; Wi-Fi MJPEG camera stream (provisioned over BLE with SET_WIFI)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
    espressif/esp32-camera
build_flags =
    -D FEEDER_CAMERA
    -D FEEDER_STEPPER
    -D FEEDER_NO_LOADCELL

; ESP-WROOM-32 devkit (video prototype): 28BYJ-48 stepper via ULN2003, no load cell
; (the CCM reads the kitchen scale through the camera instead)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino
build_flags =
    -D FEEDER_STEPPER
    -D FEEDER_NO_LOADCELL
